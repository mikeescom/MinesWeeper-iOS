name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test on an iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $udid"
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          xcodebuild test \
            -project MinesWeeper.xcodeproj \
            -scheme MinesWeeper \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
